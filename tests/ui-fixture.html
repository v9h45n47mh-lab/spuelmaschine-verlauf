<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Kit integration test</title><style>body{margin:0;padding:8px;background:var(--primary-background-color,#fafafa);color:var(--primary-text-color,#212121);font-family:Arial,sans-serif}.test-card{display:block;max-width:600px;margin:0 auto 16px}body.dark{--primary-background-color:#111;--ha-card-background:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#aaa;--divider-color:#444;--secondary-background-color:#282828;--input-fill-color:#282828;--primary-color:#03a9f4}</style><script type="module">
import {UI_CSS,navigation,button} from '/custom_components/spuelmaschine_verlauf/frontend/family-ui/1.2.0/family-ui.js';

const today='2026-11-10',listeners=new Set();let revision=1;
let tasks=[{id:'t',title:'Bad putzen / Flur wischen',description:'Boden und Waschbecken reinigen',assignees:['Paul','Maximilian'],kind:'weekly',interval:2,start:today,end:'2027-05-04',weekdays:[1],nth:2,alternating:true,first_person:'Paul',editable:true}];
let occurrences=[{task_id:'t',person:'Paul',title:tasks[0].title,description:tasks[0].description,date:today,completed:false},{task_id:'t',person:'Maximilian',title:tasks[0].title,description:tasks[0].description,date:today,completed:false},{task_id:'long',person:'Paul',title:'Bettwäsche waschen und anschließend zum Trocknen aufhängen',date:today,completed:false}];
const snapshot=person=>({revision,today,person,parent:person==='Vera',settings_allowed:person==='Vera',version:'0.4.3',tasks:person==='Vera'?tasks:[],occurrences:occurrences.filter(e=>person==='Vera'||e.person===person),vacation_active:false,vacations:[]});
window.calls=[];window.cards=[];
function hass(person){return {user:{id:person,name:person},locale:{language:'de-DE'},config:{time_zone:'Europe/Berlin'},states:{'input_select.spuelmaschine_dienst':{state:'Paul'},'sensor.spulmaschine_verlauf':{state:'3',attributes:{offener_spuelgang:'new',eintraege:[{id:'new',status:'offen',assigned_to:'Paul',finished_at:'2026-11-10T15:00:00Z'},{id:'one',status:'erledigt',emptied_by:'Vera',emptied_at:'2026-11-09T16:30:00Z'},{id:'old',status:'erledigt',emptied_by:'Paul',emptied_at:'2026-10-08T16:00:00Z'}],statistik:[{total:23,assumed:2,people:{Paul:8,Maximilian:9,'Vera / Manuel':6}}]}}},connection:{subscribeMessage:async cb=>{listeners.add(cb);queueMicrotask(()=>cb({}));return()=>listeners.delete(cb)}},callWS:async msg=>{window.calls.push(msg);if(!msg.type.endsWith('/get')){if(msg.revision!==revision)throw Error('Revision');if(msg.type.endsWith('/complete')||msg.type.endsWith('/reopen')){if(person==='Vera'||msg.person!==person)throw Error('Keine Berechtigung');occurrences=occurrences.map(e=>e.task_id===msg.task_id&&e.person===person?{...e,completed:msg.type.endsWith('/complete')}:e);}if(msg.type.endsWith('/save_task')){if(person!=='Vera'&&(msg.task.kind!=='once'||msg.task.assignees.join()!==person))throw Error('Keine Berechtigung');tasks.push({...msg.task,id:'saved',editable:true});}revision++;listeners.forEach(cb=>cb({}));}return snapshot(person);}}}
for(const person of ['Vera','Paul']){const card=document.createElement('spuelmaschine-verlauf-card');card.className='test-card';card.setAttribute('data-person',person);card.setConfig({history_open:true});card.hass=hass(person);window.cards.push(card);document.body.append(card);}const reference=document.createElement('kit-reference');reference.className='test-card';document.body.append(reference);window.ready=true;
</script></html>
